name: results-outputs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate_outputs.py"
      - ".github/workflows/results_outputs.yml"
      - "src/oec_qaoa/plotting.py"
      - "notebooks/08_figures_and_tables.ipynb"

permissions:
  actions: read
  contents: read

jobs:
  figures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install --upgrade pip && pip install -e .

      - name: Recover validated scaling results
        run: |
          RUN_ID=$(gh run list --workflow resource-scaling --status success --limit 1 --json databaseId --jq ".[0].databaseId")
          gh run download "$RUN_ID" -n resource-scaling-results -D results/scaling

      - name: Recover validated ideal-QAOA results
        run: |
          RUN_ID=$(gh run list --workflow ideal-qaoa --status success --limit 1 --json databaseId --jq ".[0].databaseId")
          gh run download "$RUN_ID" -n ideal-qaoa-results -D results/qaoa

      - name: Recover validated finite-sampling results
        run: |
          RUN_ID=$(gh run list --workflow finite-sampling --status success --limit 1 --json databaseId --jq ".[0].databaseId")
          gh run download "$RUN_ID" -n finite-sampling-results -D results/qaoa

      - name: Recover validated circuit-resource results
        run: |
          RUN_ID=$(gh run list --workflow circuit-resources --status success --limit 1 --json databaseId --jq ".[0].databaseId")
          gh run download "$RUN_ID" -n circuit-resource-results -D results/hardware

      - name: Generate figures and tables
        run: python scripts/generate_outputs.py

      - name: Upload figures and tables
        uses: actions/upload-artifact@v4
        with:
          name: figures-and-tables
          path: results/figures/*