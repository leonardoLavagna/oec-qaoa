name: qaoa-conditioning

on:
  push:
    branches: [main]
    paths:
      - "scripts/run_qaoa_conditioning.py"
      - ".github/workflows/qaoa_conditioning.yml"
      - "src/oec_qaoa/qaoa.py"
      - "src/oec_qaoa/benchmarks.py"

jobs:
  conditioning:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install --upgrade pip && pip install -e .

      - name: Compare raw and normalized QAOA
        run: python scripts/run_qaoa_conditioning.py

      - name: Upload conditioning tables
        uses: actions/upload-artifact@v4
        with:
          name: qaoa-conditioning-results
          path: results/qaoa/qaoa_conditioning_*.csv
