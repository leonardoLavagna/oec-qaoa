name: finite-sampling

on:
  push:
    branches: [main]
    paths:
      - "scripts/run_finite_sampling.py"
      - ".github/workflows/finite_sampling.yml"
      - "src/oec_qaoa/finite_sampling.py"
      - "src/oec_qaoa/qaoa.py"
      - "src/oec_qaoa/benchmarks.py"

jobs:
  sampling:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install --upgrade pip && pip install -e .

      - name: Run finite-sampling study
        run: python scripts/run_finite_sampling.py

      - name: Upload finite-sampling tables
        uses: actions/upload-artifact@v4
        with:
          name: finite-sampling-results
          path: results/qaoa/finite_sampling_*.csv
