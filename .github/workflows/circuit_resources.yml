name: circuit-resources

on:
  push:
    branches: [main]
    paths:
      - "scripts/run_circuit_resources.py"
      - ".github/workflows/circuit_resources.yml"
      - "src/oec_qaoa/circuit_resources.py"
      - "src/oec_qaoa/benchmarks.py"

jobs:
  resources:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install --upgrade pip && pip install -e .

      - name: Run circuit-resource analysis
        run: python scripts/run_circuit_resources.py

      - name: Upload resource tables
        uses: actions/upload-artifact@v4
        with:
          name: circuit-resource-results
          path: results/hardware/*.csv